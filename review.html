<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Product Review Confirmation">
    <meta name="author" content="Your Name">
    <title>Review Submitted</title>
    <link rel="stylesheet" href="styles/form.css">
</head>

<body>
    <header>
        <h1>Product Review</h1>
    </header>

    <main>
        <section class="confirmation">
            <h2>Thank You!</h2>

            <p>
                Your product review has been successfully submitted.
            </p>

            <p>
                Number of reviews completed:
                <strong id="reviewCount">0</strong>
            </p>

            <a href="form.html" class="button">
                Submit Another Review
            </a>
        </section>
    </main>

    <footer>
        <p>
            &copy; 2026 | WDD 131 Product Review Form
        </p>

        <p>
            Last Modification:
            <span id="lastModified"></span>
        </p>
    </footer>

    <script>
        let reviewCount = Number(localStorage.getItem("reviewCount")) || 0;

        reviewCount++;

        localStorage.setItem("reviewCount", reviewCount);

        document.querySelector("#reviewCount").textContent = reviewCount;

        document.querySelector("#lastModified").textContent =
            document.lastModified;
    </script>
</body>
</html>
