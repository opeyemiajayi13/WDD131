<!DOCTYPE html><html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Contact our church and send us a message.">
    <title>Contact | Church Website</title><link rel="stylesheet" href="styles/site.css">
<script src="scripts/main.js" defer></script>

</head><body>
    <header>
        <a href="index.html" class="site-name">Our Church</a>    <nav aria-label="Main navigation">
        <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="activities.html">Activities</a></li>
            <li><a href="contact.html" aria-current="page">Contact</a></li>
        </ul>
    </nav>
</header>

<main>
    <h1>Contact Us</h1>

    <section>
        <h2>Send Us a Message</h2>

        <form id="contact-form">
            <div>
                <label for="fullname">Full Name</label>
                <input
                    type="text"
                    id="fullname"
                    name="fullname"
                    autocomplete="name"
                    required>
            </div>

            <div>
                <label for="email">Email Address</label>
                <input
                    type="email"
                    id="email"
                    name="email"
                    autocomplete="email"
                    required>
            </div>

            <div>
                <label for="subject">Subject</label>
                <select id="subject" name="subject" required>
                    <option value="">Choose a subject</option>
                    <option value="services">Church Services</option>
                    <option value="activities">Activities</option>
                    <option value="general">General Enquiry</option>
                </select>
            </div>

            <div>
                <label for="message">Your Message</label>
                <textarea
                    id="message"
                    name="message"
                    rows="5"
                    required></textarea>
            </div>

            <button type="submit">Send Message</button>
        </form>

        <p id="form-feedback" aria-live="polite"></p>
    </section>
</main>

<footer>
    <p>&copy; <span id="current-year"></span> Our Church</p>
    <a href="references.html">References</a>
</footer>

</body>
</html>
